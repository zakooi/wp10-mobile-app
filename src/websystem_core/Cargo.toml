[package]
name = "websystem_core"
version = "0.5.0"
edition = "2021"
description = "Native Rust browser core for WebSystemUwp (Windows 10 Mobile)"

[lib]
name = "websystem_core"
crate-type = ["cdylib"]

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
scraper = "0.23"
taffy = "0.9"
boa_engine = { version = "0.22", default-features = false, features = ["jsvalue-enum"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
