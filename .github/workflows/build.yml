name: Build UWP (Windows 10 Mobile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # windows-2019 có sẵn VS 2019 + Windows 10 SDK 10.0.19041 (project đã retarget sang SDK này).
    runs-on: windows-2019
    env:
      # Nếu bạn đặt secrets CERT_BASE64 + CERT_PASSPHRASE, appx sẽ được ký tự động.
      # CERT_BASE64 = nội dung file .pfx mã hóa Base64. CERT_PASSPHRASE = mật khẩu pfx.
      CERT_BASE64: ${{ secrets.CERT_BASE64 }}

    strategy:
      fail-fast: false
      matrix:
        # x86: kiểm tra biên dịch nhanh. ARM: tạo gói cài được lên máy W10M thật.
        arch: [ x86, ARM ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Restore NuGet packages
        run: msbuild WebSystemUwp.csproj /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.arch }}

      # Build + đóng gói .appx. Cần Assets/*.png tồn tại — nếu thiếu, chạy:
      #   powershell -ExecutionPolicy Bypass -File scripts\generate-assets.ps1
      - name: Build + package .appx
        shell: pwsh
        run: >
          msbuild WebSystemUwp.csproj
          /p:Configuration=Release
          /p:Platform=${{ matrix.arch }}
          /p:AppxBundle=Never
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /m

      - name: Sign .appx (if cert provided via secrets)
        if: env.CERT_BASE64 != ''
        shell: pwsh
        env:
          CERT_PASSPHRASE: ${{ secrets.CERT_PASSPHRASE }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $appx = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Recurse -Filter *.appx |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $appx) { Write-Warning "Không tìm thấy .appx để ký."; exit 0 }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\sign-appx.ps1') -AppxPath $appx -PfxPath $pfx -Password $env:CERT_PASSPHRASE

      - name: Upload .appx artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebSystemUwp-${{ matrix.arch }}
          path: |
            AppPackages\**\*.appx
            Bin\**\*.appx
          if-no-files-found: warn
